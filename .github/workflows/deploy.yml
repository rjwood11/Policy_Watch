name: Deploy Static Site

on:
  push:
    branches: ["main"]
  schedule:
    - cron: "17 10 * * 1"
  workflow_dispatch:
    inputs:
      refresh_live_layers:
        description: "Refresh weekly EPA ECHO and TDEC permit cache before building"
        required: true
        type: boolean
        default: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: npm ci

      - name: Install weekly refresh dependencies
        run: python -m pip install requests

      - name: Refresh weekly EPA ECHO and TDEC cache
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.refresh_live_layers }}
        run: npm run data:refresh-weekly

      - name: Build static site
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
